name: infrahub

# Stack de monitoramento de infraestrutura externa via Zabbix, acoplavel ao
# ambiente principal (mesmo padrao do docker-compose.monitoring.yml):
#   docker compose -f docker-compose.yml -f docker-compose.zabbix.yml up -d
services:
  zabbix-postgres:
    image: timescale/timescaledb:2.17.2-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-change-me}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
    volumes:
      - zabbix_postgres_data:/var/lib/postgresql/data
      - ./infra/zabbix/init-timescaledb.sql:/docker-entrypoint-initdb.d/init-timescaledb.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${ZABBIX_DB_USER:-zabbix} -d ${ZABBIX_DB_NAME:-zabbix}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - infrahub

  zabbix-timescaledb-setup:
    image: timescale/timescaledb:2.17.2-pg16
    restart: "no"
    entrypoint: ["/bin/sh", "/wait-and-apply-timescaledb.sh"]
    environment:
      ZABBIX_DB_USER: ${ZABBIX_DB_USER:-zabbix}
      ZABBIX_DB_PASSWORD: ${ZABBIX_DB_PASSWORD:-change-me}
      ZABBIX_DB_NAME: ${ZABBIX_DB_NAME:-zabbix}
    volumes:
      - ./infra/zabbix/wait-and-apply-timescaledb.sh:/wait-and-apply-timescaledb.sh:ro
      - ./infra/zabbix/timescaledb-setup.sql:/timescaledb-setup.sql:ro
    depends_on:
      zabbix-postgres:
        condition: service_healthy
    networks:
      - infrahub

  zabbix-server:
    image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-change-me}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
    ports:
      - "${ZABBIX_SERVER_PORT:-10051}:10051"
    depends_on:
      zabbix-postgres:
        condition: service_healthy
    networks:
      - infrahub

  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:alpine-7.0-latest
    restart: unless-stopped
    environment:
      DB_SERVER_HOST: zabbix-postgres
      POSTGRES_USER: ${ZABBIX_DB_USER:-zabbix}
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-change-me}
      POSTGRES_DB: ${ZABBIX_DB_NAME:-zabbix}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
    ports:
      - "${ZABBIX_WEB_PORT:-8082}:8080"
    depends_on:
      - zabbix-server
    networks:
      - infrahub

  zabbix-agent2:
    image: zabbix/zabbix-agent2:alpine-7.0-latest
    restart: unless-stopped
    environment:
      ZBX_HOSTNAME: infrahub-docker-host
      ZBX_SERVER_HOST: zabbix-server
    depends_on:
      - zabbix-server
    networks:
      - infrahub

networks:
  infrahub:
    driver: bridge

volumes:
  zabbix_postgres_data:
