apiVersion: apps/v1
kind: Deployment
metadata:
  name: zabbix-server
  namespace: zabbix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zabbix-server
  template:
    metadata:
      labels:
        app: zabbix-server
    spec:
      containers:
        - name: zabbix-server
          image: zabbix/zabbix-server-pgsql:alpine-7.0-latest
          ports:
            - containerPort: 10051
          env:
            - name: DB_SERVER_HOST
              value: zabbix-postgres
            - name: POSTGRES_USER
              valueFrom:
                secretKeyRef: { name: zabbix-secret, key: ZABBIX_DB_USER }
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef: { name: zabbix-secret, key: ZABBIX_DB_PASSWORD }
            - name: POSTGRES_DB
              valueFrom:
                secretKeyRef: { name: zabbix-secret, key: ZABBIX_DB_NAME }
---
apiVersion: v1
kind: Service
metadata:
  name: zabbix-server
  namespace: zabbix
spec:
  selector:
    app: zabbix-server
  ports:
    - port: 10051
      targetPort: 10051
---
# NodePort para o trapper (10051) ser alcancavel pela LAN. Diferente do CRC
# (que so expoe NodePort em 127.0.0.1 no host Windows), a VM do k3s tem IP
# real na rede (192.168.2.53) -- as DCs alcancam 192.168.2.53:31051 direto,
# sem netsh portproxy nem nenhum outro truque de rede.
apiVersion: v1
kind: Service
metadata:
  name: zabbix-server-nodeport
  namespace: zabbix
spec:
  type: NodePort
  selector:
    app: zabbix-server
  ports:
    - port: 10051
      targetPort: 10051
      nodePort: 31051
