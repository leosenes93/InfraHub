# AVISO: valores de exemplo (change-me). Em um cluster real, sobrescreva via
# --set ou um values-secrets.yaml separado e não versionado, ou substitua este
# Secret por um gerenciado externamente (Sealed Secrets, External Secrets, Vault).
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "infrahub.fullname" . }}-secret
  labels:
    {{- include "infrahub.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ include "infrahub.databaseUrl" . | quote }}
  JWT_SECRET_KEY: {{ .Values.secrets.jwtSecretKey | quote }}
  INITIAL_ADMIN_PASSWORD: {{ .Values.secrets.initialAdminPassword | quote }}
