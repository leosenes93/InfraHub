apiVersion: v1
kind: Service
metadata:
  name: {{ include "infrahub.fullname" . }}-web
  labels:
    {{- include "infrahub.labels" . | nindent 4 }}
    app.kubernetes.io/component: web
spec:
  selector:
    {{- include "infrahub.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: web
  ports:
    - name: http
      port: 80
      targetPort: {{ .Values.web.port }}
