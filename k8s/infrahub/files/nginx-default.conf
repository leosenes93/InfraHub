# Variante da configuracao de producao do Nginx para Kubernetes.
#
# Por que nao reaproveitar infra/nginx/conf.d/default.prod.conf tal e qual:
# aquele arquivo usa "resolver 127.0.0.11" (o DNS interno do Docker) para
# reresolver o hostname do backend a cada requisicao, contornando o fato de
# que um container Docker recriado troca de IP. Em Kubernetes isso nao existe
# (127.0.0.11 nao e roteavel de dentro de um Pod) e tambem nao e necessario:
# o Service "backend" tem um ClusterIP estavel durante toda a sua vida,
# independente de quais Pods estejam por tras dele — um "upstream" resolvido
# uma vez no start do Nginx ja e suficiente e correto.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|svg|png|jpg|jpeg|gif|ico|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }
}
